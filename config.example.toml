[server]
host = "127.0.0.1"
port = 18881
selection_file = "~/.config/cursor-model-router/selection.json"
# Set to "CURSOR_ROUTER_TOKEN" before exposing the service through HTTPS.
# The named value must exist in .env or the process environment.
gateway_token_env = ""

# Optional. Download the official tokenizer with scripts/download-tokenizer.sh.
# Without it, context counting falls back to a conservative byte estimate.
tokenizer_path = ".deepseek-tokenizer.json"

# Base aliases appear in Cursor; compatibility aliases can be hidden with
# hidden_from_picker=true. The Cursor extension exposes selectable presets.
# DeepSeek's API key can come from .env (DEEPSEEK_API_KEY), or from the
# Authorization header Cursor already sends. Never put a real key here.

[models."deepseek-flash-256k-low"]
hidden_from_picker = true
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
protocol = "openai-chat-completions"
context_tokens = 262144
max_output_tokens = 393216
thinking = true
reasoning_effort = "low"

[models."deepseek-flash-256k-high"]
hidden_from_picker = true
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
